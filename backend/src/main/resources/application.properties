# Import Environment Variables from config.properties file
spring.config.import=optional:file:config.properties

# Spring Boot Application Configuration
spring.application.name=Employee-Management

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?ssl-mode=DISABLED
spring.datasource.username=root
spring.datasource.password=Pass123

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/employee_db

# Server Configuration
server.port=8080
